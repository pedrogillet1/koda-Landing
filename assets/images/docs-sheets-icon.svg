<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80" fill="none">
  <!-- XLS card (green, behind, rotated left) -->
  <g transform="translate(4, 6) rotate(-6, 32, 36)">
    <rect width="58" height="52" rx="10" fill="url(#greenGrad)"/>
    <text x="29" y="33" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" letter-spacing="1">XLS</text>
  </g>
  <!-- DOC card (blue, front, rotated right) -->
  <g transform="translate(52, 8) rotate(5, 32, 34)">
    <rect width="58" height="52" rx="10" fill="url(#blueGrad)"/>
    <text x="29" y="33" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" letter-spacing="1">DOC</text>
  </g>
  <defs>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="58" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="58" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
</svg>
