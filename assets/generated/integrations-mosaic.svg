<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="rgba(16,24,40,0.06)"/>
    </filter>
    <style>
      text { font-family: "Plus Jakarta Sans", -apple-system, sans-serif; fill: #0D0F12; }
      .node { fill: #FCFCFA; stroke: rgba(16,24,40,0.08); stroke-width: 1.2; filter: url(#sh); }
      .conn { fill: none; stroke: #D1D5DB; stroke-width: 1; }
      .lbl { font-size: 10px; text-anchor: middle; fill: #6B7280; }
      .icon-text { font-size: 14px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <!-- Connection lines (curves from center to each node) -->
  <path class="conn" d="M320,160 Q220,130 160,80"/>
  <path class="conn" d="M320,160 Q420,130 480,80"/>
  <path class="conn" d="M320,160 Q220,190 160,240"/>
  <path class="conn" d="M320,160 Q420,190 480,240"/>

  <!-- Center: Allybi Hub -->
  <circle class="node" cx="320" cy="160" r="36"/>
  <text x="320" y="156" text-anchor="middle" font-size="10" font-weight="700" fill="#0D0F12">Allybi</text>
  <text x="320" y="170" text-anchor="middle" font-size="8" fill="#6B7280">AI Hub</text>

  <!-- Gmail - top left -->
  <rect class="node" x="110" y="40" width="80" height="56" rx="10"/>
  <!-- Envelope icon -->
  <rect x="134" y="52" width="32" height="22" rx="3" fill="none" stroke="#D1D5DB" stroke-width="1"/>
  <polyline points="134,52 150,66 166,52" fill="none" stroke="#EA4335" stroke-width="1.2"/>
  <text class="lbl" x="150" y="86">Gmail</text>

  <!-- Outlook - top right -->
  <rect class="node" x="440" y="40" width="80" height="56" rx="10"/>
  <rect x="464" y="52" width="32" height="22" rx="3" fill="none" stroke="#D1D5DB" stroke-width="1"/>
  <polyline points="464,52 480,66 496,52" fill="none" stroke="#2563EB" stroke-width="1.2"/>
  <text class="lbl" x="480" y="86">Outlook</text>

  <!-- Slack - bottom left -->
  <rect class="node" x="110" y="216" width="80" height="56" rx="10"/>
  <!-- Hash icon -->
  <text x="150" y="250" text-anchor="middle" font-size="22" font-weight="300" fill="#6B7280">#</text>
  <text class="lbl" x="150" y="264">Slack</text>

  <!-- Docs/Sheets - bottom right -->
  <rect class="node" x="440" y="216" width="80" height="56" rx="10"/>
  <!-- Doc icon -->
  <rect x="466" y="228" width="28" height="32" rx="2" fill="none" stroke="#D1D5DB" stroke-width="1"/>
  <line x1="472" y1="238" x2="488" y2="238" stroke="#16A34A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="472" y1="244" x2="486" y2="244" stroke="#D1D5DB" stroke-width="1" stroke-linecap="round"/>
  <line x1="472" y1="250" x2="484" y2="250" stroke="#D1D5DB" stroke-width="1" stroke-linecap="round"/>
  <text class="lbl" x="480" y="264">Docs &amp; Sheets</text>

  <!-- Decorative dots on connection lines -->
  <circle cx="238" cy="120" r="2.5" fill="#E5E7EB"/>
  <circle cx="402" cy="120" r="2.5" fill="#E5E7EB"/>
  <circle cx="238" cy="200" r="2.5" fill="#E5E7EB"/>
  <circle cx="402" cy="200" r="2.5" fill="#E5E7EB"/>
</svg>