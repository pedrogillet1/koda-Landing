<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="fs" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="rgba(16,24,40,0.06)"/>
    </filter>
    <style>
      text { font-family: "Plus Jakarta Sans", -apple-system, sans-serif; fill: #0D0F12; }
      .card { fill: #FCFCFA; stroke: rgba(16,24,40,0.08); stroke-width: 1; rx: 8; filter: url(#fs); }
      .sidebar { fill: #F6F7F8; stroke: rgba(16,24,40,0.06); stroke-width: 1; rx: 8; }
      .t12 { font-size: 12px; font-weight: 600; }
      .t10 { font-size: 10px; fill: #6B7280; }
      .t9 { font-size: 9px; fill: #9CA3AF; }
      .folder-icon { fill: none; stroke: #D1D5DB; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#F6F7F8" rx="12"/>

  <!-- Left sidebar: folder tree -->
  <rect class="sidebar" x="24" y="24" width="160" height="352"/>
  <text class="t10" x="44" y="52" font-weight="600" fill="#0D0F12">Workspaces</text>
  <line x1="44" y1="60" x2="160" y2="60" stroke="rgba(16,24,40,0.06)" stroke-width="0.8"/>

  <!-- Folder: Deal Room -->
  <rect x="36" y="72" width="136" height="30" rx="6" fill="#FCFCFA" stroke="rgba(16,24,40,0.08)" stroke-width="0.8"/>
  <path d="M50,82 L50,78 Q50,76 52,76 L58,76 L60,78 L66,78 Q68,78 68,80 L68,90 Q68,92 66,92 L52,92 Q50,92 50,90 Z" class="folder-icon" fill="#2563EB" opacity="0.15" stroke="#2563EB"/>
  <text x="76" y="92" font-size="10" font-weight="600" font-family="Plus Jakarta Sans, -apple-system, sans-serif" fill="#0D0F12">Deal Room</text>

  <!-- Folder: Board Decks -->
  <path d="M50,118 L50,114 Q50,112 52,112 L58,112 L60,114 L66,114 Q68,114 68,116 L68,126 Q68,128 66,128 L52,128 Q50,128 50,126 Z" class="folder-icon"/>
  <text class="t10" x="76" y="124">Board Decks</text>

  <!-- Folder: Cap Tables -->
  <path d="M50,148 L50,144 Q50,142 52,142 L58,142 L60,144 L66,144 Q68,144 68,146 L68,156 Q68,158 66,158 L52,158 Q50,158 50,156 Z" class="folder-icon"/>
  <text class="t10" x="76" y="154">Cap Tables</text>

  <!-- Active indicator -->
  <rect x="28" y="73" width="3" height="28" rx="1.5" fill="#2563EB"/>

  <!-- Main panel -->
  <rect class="card" x="200" y="24" width="376" height="352"/>

  <!-- Query bar -->
  <rect x="220" y="44" width="336" height="40" rx="8" fill="#F6F7F8" stroke="rgba(16,24,40,0.08)" stroke-width="0.8"/>
  <!-- Search icon -->
  <circle cx="240" cy="64" r="7" fill="none" stroke="#9CA3AF" stroke-width="1.2"/>
  <line x1="245" y1="69" x2="249" y2="73" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round"/>
  <text class="t10" x="256" y="68" fill="#0D0F12" font-weight="500">Q1 revenue from the latest board deck?</text>

  <!-- Thinking indicator -->
  <text class="t9" x="220" y="108">Searching Board Decks...</text>

  <!-- Answer card -->
  <rect x="220" y="120" width="336" height="100" rx="8" fill="#FCFCFA" stroke="rgba(16,24,40,0.08)" stroke-width="1"/>
  <!-- Green left accent -->
  <rect x="220" y="124" width="3" height="92" rx="1.5" fill="#16A34A"/>

  <text x="240" y="148" font-size="22" font-weight="700" font-family="Plus Jakarta Sans, -apple-system, sans-serif" fill="#0D0F12">$4.2M</text>
  <text class="t10" x="240" y="168">Q1 2026 consolidated revenue</text>

  <!-- Source chip -->
  <rect x="240" y="180" width="220" height="22" rx="6" fill="#F6F7F8" stroke="rgba(16,24,40,0.06)" stroke-width="0.8"/>
  <!-- Doc icon -->
  <rect x="250" y="184" width="10" height="13" rx="1.5" fill="none" stroke="#9CA3AF" stroke-width="0.8"/>
  <text class="t9" x="266" y="195">Board_Deck_Q1.pptx — Slide 8</text>

  <!-- Confidence bar -->
  <text class="t9" x="220" y="246">Source confidence</text>
  <rect x="304" y="238" width="80" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="304" y="238" width="68" height="6" rx="3" fill="#16A34A" opacity="0.5"/>
  <text class="t9" x="390" y="246">High</text>

  <!-- Attach & send chip -->
  <rect x="416" y="330" width="140" height="32" rx="8" fill="#0D0F12"/>
  <text x="486" y="350" text-anchor="middle" font-size="10" font-weight="600" font-family="Plus Jakarta Sans, -apple-system, sans-serif" fill="#FCFCFA">Attach &amp; Send</text>
  <!-- Arrow icon -->
  <path d="M434,346 L440,340 L446,346" fill="none" stroke="#FCFCFA" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="440" y1="340" x2="440" y2="352" stroke="#FCFCFA" stroke-width="1.2" stroke-linecap="round"/>
</svg>