<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="ds" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(16,24,40,0.06)"/>
    </filter>
    <style>
      text { font-family: "Plus Jakarta Sans", -apple-system, sans-serif; fill: #0D0F12; }
      .panel { fill: #FCFCFA; stroke: rgba(16,24,40,0.08); stroke-width: 1; rx: 8; filter: url(#ds); }
      .bar { rx: 2; fill: #E5E7EB; }
      .bar-short { rx: 2; fill: #E5E7EB; }
      .head { font-size: 11px; font-weight: 600; }
      .sub { font-size: 9px; fill: #9CA3AF; }
      .chip { font-size: 8px; fill: #6B7280; }
    </style>
  </defs>

  <!-- Left panel (behind, slightly offset) -->
  <rect class="panel" x="60" y="40" width="260" height="310"/>
  <!-- Header bar -->
  <rect x="60" y="40" width="260" height="36" rx="8" fill="#F6F7F8" stroke="rgba(16,24,40,0.06)" stroke-width="1"/>
  <text class="head" x="80" y="63">SPA Draft v2</text>
  <text class="sub" x="246" y="63">Mar 12, 2026</text>

  <!-- Text lines -->
  <rect class="bar" x="80" y="92" width="200" height="6"/>
  <rect class="bar" x="80" y="106" width="180" height="6"/>
  <rect class="bar" x="80" y="120" width="210" height="6"/>
  <rect class="bar" x="80" y="134" width="160" height="6"/>
  <rect class="bar" x="80" y="160" width="190" height="6"/>
  <rect class="bar" x="80" y="174" width="220" height="6"/>
  <rect class="bar" x="80" y="188" width="170" height="6"/>
  <rect class="bar" x="80" y="214" width="200" height="6"/>
  <rect class="bar" x="80" y="228" width="190" height="6"/>
  <rect class="bar" x="80" y="242" width="210" height="6"/>
  <rect class="bar" x="80" y="268" width="180" height="6"/>
  <rect class="bar" x="80" y="282" width="200" height="6"/>
  <rect class="bar" x="80" y="296" width="160" height="6"/>

  <!-- Right panel (front, overlapping) -->
  <rect class="panel" x="280" y="28" width="270" height="330"/>
  <!-- Header bar -->
  <rect x="280" y="28" width="270" height="36" rx="8" fill="#0D0F12"/>
  <text class="head" x="300" y="51" fill="#FCFCFA">SPA Draft v3</text>
  <text class="sub" x="474" y="51" fill="rgba(255,255,255,0.5)">Mar 24, 2026</text>
  <!-- Current badge -->
  <rect x="380" y="39" width="48" height="16" rx="8" fill="#16A34A" opacity="0.15"/>
  <text x="404" y="50" text-anchor="middle" font-size="8" fill="#16A34A" font-weight="600" font-family="Plus Jakarta Sans, -apple-system, sans-serif">Current</text>

  <!-- Text lines -->
  <rect class="bar" x="300" y="80" width="210" height="6"/>
  <rect class="bar" x="300" y="94" width="190" height="6"/>
  <rect class="bar" x="300" y="108" width="220" height="6"/>
  <rect class="bar" x="300" y="122" width="170" height="6"/>

  <!-- Highlighted changed section -->
  <rect x="294" y="144" width="244" height="52" rx="4" fill="#FEFCE8" stroke="#FDE68A" stroke-width="0.8"/>
  <rect x="300" y="152" width="200" height="6" rx="2" fill="#D97706" opacity="0.25"/>
  <rect x="300" y="166" width="220" height="6" rx="2" fill="#D97706" opacity="0.25"/>
  <rect x="300" y="180" width="180" height="6" rx="2" fill="#D97706" opacity="0.25"/>
  <!-- Change indicator -->
  <rect x="286" y="152" width="3" height="34" rx="1.5" fill="#D97706" opacity="0.6"/>

  <!-- More text lines -->
  <rect class="bar" x="300" y="212" width="210" height="6"/>
  <rect class="bar" x="300" y="226" width="190" height="6"/>
  <rect class="bar" x="300" y="240" width="220" height="6"/>
  <rect class="bar" x="300" y="266" width="200" height="6"/>
  <rect class="bar" x="300" y="280" width="180" height="6"/>
  <rect class="bar" x="300" y="294" width="210" height="6"/>
  <rect class="bar" x="300" y="308" width="170" height="6"/>

  <!-- Citation chip -->
  <rect x="320" y="332" width="180" height="20" rx="10" fill="#F6F7F8" stroke="rgba(16,24,40,0.08)" stroke-width="0.8"/>
  <text class="chip" x="410" y="345" text-anchor="middle">Section 8.3(b) — p. 14</text>
</svg>