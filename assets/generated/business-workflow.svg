<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="bs" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="rgba(16,24,40,0.06)"/>
    </filter>
    <style>
      text { font-family: "Plus Jakarta Sans", -apple-system, sans-serif; fill: #0D0F12; }
      .card { fill: #FCFCFA; stroke: rgba(16,24,40,0.08); stroke-width: 1; rx: 8; filter: url(#bs); }
      .t12 { font-size: 12px; font-weight: 600; }
      .t10 { font-size: 10px; fill: #6B7280; }
      .t9 { font-size: 9px; fill: #9CA3AF; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#F6F7F8" rx="12"/>

  <!-- Step 1: Search bar -->
  <rect class="card" x="40" y="28" width="520" height="44" rx="10"/>
  <circle cx="68" cy="50" r="8" fill="none" stroke="#9CA3AF" stroke-width="1.2"/>
  <line x1="74" y1="56" x2="78" y2="60" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round"/>
  <text x="88" y="54" font-size="11" font-weight="500" font-family="Plus Jakarta Sans, -apple-system, sans-serif" fill="#0D0F12">Latest proposal for Project Alpha?</text>
  <!-- Step label -->
  <rect x="480" y="39" width="56" height="18" rx="9" fill="#2563EB" opacity="0.1"/>
  <text x="508" y="51" text-anchor="middle" font-size="8" font-weight="600" font-family="Plus Jakarta Sans, -apple-system, sans-serif" fill="#2563EB">Step 1</text>

  <!-- Connector -->
  <line x1="300" y1="72" x2="300" y2="92" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4,3"/>
  <polygon points="296,90 300,98 304,90" fill="#D1D5DB"/>

  <!-- Step 2: Result card -->
  <rect class="card" x="40" y="100" width="520" height="90"/>
  <rect x="480" y="107" width="56" height="18" rx="9" fill="#2563EB" opacity="0.1"/>
  <text x="508" y="119" text-anchor="middle" font-size="8" font-weight="600" font-family="Plus Jakarta Sans, -apple-system, sans-serif" fill="#2563EB">Step 2</text>

  <text class="t10" x="60" y="122" font-weight="600" fill="#0D0F12">Found 1 result</text>

  <!-- Document result -->
  <rect x="60" y="132" width="480" height="44" rx="6" fill="#F6F7F8" stroke="rgba(16,24,40,0.06)" stroke-width="0.8"/>
  <!-- File icon -->
  <rect x="72" y="139" width="18" height="24" rx="2" fill="none" stroke="#D1D5DB" stroke-width="1"/>
  <path d="M82,139 L90,147" stroke="#D1D5DB" stroke-width="0.8"/>
  <text x="100" y="152" font-size="11" font-weight="600" font-family="Plus Jakarta Sans, -apple-system, sans-serif" fill="#0D0F12">Proposal_v2.pdf</text>
  <text class="t9" x="100" y="166">Project Alpha — Updated Mar 20, 2026 — 2.4 MB</text>
  <!-- Match badge -->
  <rect x="440" y="144" width="80" height="18" rx="9" fill="#16A34A" opacity="0.1"/>
  <text x="480" y="156" text-anchor="middle" font-size="8" font-weight="600" font-family="Plus Jakarta Sans, -apple-system, sans-serif" fill="#16A34A">Best match</text>

  <!-- Connector -->
  <line x1="300" y1="190" x2="300" y2="210" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4,3"/>
  <polygon points="296,208 300,216 304,208" fill="#D1D5DB"/>

  <!-- Step 3: Message draft panel -->
  <rect class="card" x="40" y="218" width="520" height="110"/>
  <rect x="480" y="225" width="56" height="18" rx="9" fill="#2563EB" opacity="0.1"/>
  <text x="508" y="237" text-anchor="middle" font-size="8" font-weight="600" font-family="Plus Jakarta Sans, -apple-system, sans-serif" fill="#2563EB">Step 3</text>

  <!-- Email header -->
  <text class="t9" x="60" y="240">To: client@example.com</text>
  <text class="t12" x="60" y="258">Re: Project Alpha</text>
  <!-- Message body lines -->
  <rect x="60" y="268" width="340" height="5" rx="2" fill="#E5E7EB"/>
  <rect x="60" y="279" width="300" height="5" rx="2" fill="#E5E7EB"/>

  <!-- Attachment chip -->
  <rect x="60" y="294" width="150" height="22" rx="6" fill="#F6F7F8" stroke="rgba(16,24,40,0.06)" stroke-width="0.8"/>
  <text class="t9" x="72" y="309" fill="#6B7280">📎 Proposal_v2.pdf attached</text>

  <!-- Connector -->
  <line x1="300" y1="328" x2="300" y2="344" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4,3"/>
  <polygon points="296,342 300,350 304,342" fill="#D1D5DB"/>

  <!-- Confirm before sending badge -->
  <rect x="190" y="352" width="220" height="36" rx="10" fill="#FCFCFA" stroke="#16A34A" stroke-width="1.2" filter="url(#bs)"/>
  <circle cx="218" cy="370" r="9" fill="#16A34A" opacity="0.12"/>
  <polyline points="214,370 217,373 223,367" fill="none" stroke="#16A34A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="234" y="374" font-size="11" font-weight="600" font-family="Plus Jakarta Sans, -apple-system, sans-serif" fill="#16A34A">Confirm before sending</text>
</svg>